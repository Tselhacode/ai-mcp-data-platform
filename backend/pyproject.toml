[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-mcp-data-platform-backend"
version = "0.1.0"
description = "AI MCP Data Platform backend — Phase 1A foundation"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastmcp[server]>=4.0.5",
    "mcp>=1.0",
    "sqlglot>=30.19.0",
    "langchain-core>=1.6.4",
    "langchain-aws>=1.7.9",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.12",
    "langsmith>=0.14.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "sqlalchemy[mypy]>=2.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "data", "services", "agent", "mcp", "llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # LangGraph V1.0 deprecates create_react_agent from langgraph.prebuilt.
    # The new import path requires installing `langchain` separately, which is
    # not in our dependencies. The current import still works until LangGraph V2.0.
    "ignore:create_react_agent has been moved",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must set os.environ and warnings filters before importing
# test dependencies that trigger LangChain/LangGraph initialization.
"tests/conftest.py" = ["E402"]
"evaluations/tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "data", "services", "agent", "mcp", "llm"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
exclude = ["alembic/"]

# Tests use implicit None return types - relax strict checking for test files
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# MCP tools use @mcp.tool() decorator which is untyped
[[tool.mypy.overrides]]
module = "mcp.tools.*"
disallow_untyped_decorators = false

# mcp SDK __init__.py has compatibility shims that mypy cannot resolve
[[tool.mypy.overrides]]
module = "mcp"
disable_error_code = ["attr-defined"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
